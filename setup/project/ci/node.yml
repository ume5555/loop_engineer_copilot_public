name: verify

on:
{{CI_ON}}

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [{{CI_OS}}]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: {{CI_NODE}}
      - if: hashFiles('package-lock.json') != ''
        run: npm ci
{{CI_STEPS}}
